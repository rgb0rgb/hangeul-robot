controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    update_rate: 200
joint_state_broadcaster:
  ros__parameters:
    map_interface_to_joint_state:
      effort: applied_effort
joint_trajectory_controller:
  ros__parameters:
    command_interfaces:
    - effort
    constraints:
      bench_joint:
        goal: 0.006
        trajectory: 0.0
      goal_time: 8.0
      stopped_velocity_tolerance: 0.02
    gains:
      bench_joint:
        antiwindup_strategy: conditional_integration
        d: 15.0
        ff_velocity_scale: 0.0
        i: 60.0
        i_clamp_max: 10.0
        i_clamp_min: -10.0
        p: 100.0
        u_clamp_max: 20.0
        u_clamp_min: -20.0
    joints:
    - bench_joint
    state_interfaces:
    - position
    - velocity
